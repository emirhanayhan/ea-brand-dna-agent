    </text>

    <!-- PDF OUTPUT -->
    <rect x="490" y="748"
      width="180"
      height="62"
      rx="10"
      fill="#E1F5EE"
      stroke="#0F6E56"
      stroke-width="0.6"/>

    <text x="580" y="773"
      text-anchor="middle"
      fill="#085041"
      font-size="15"
      font-weight="600">
      PDF output
    </text>

    <text x="580" y="794"
      text-anchor="middle"
      fill="#0F6E56"
