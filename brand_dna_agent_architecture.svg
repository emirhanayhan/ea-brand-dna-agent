<svg width="100%" height="auto" viewBox="0 0 760 840" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

  <title>Brand Intelligence Agent — Pipeline Architecture</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
