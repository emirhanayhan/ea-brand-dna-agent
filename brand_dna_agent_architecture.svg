    stroke-width="1.6"
    marker-end="url(#arrow)"/>

  <path d="M440 684 C460 715, 525 730, 580 748"
    fill="none"
    stroke="#73726C"
    stroke-width="1.6"
    marker-end="url(#arrow)"/>

