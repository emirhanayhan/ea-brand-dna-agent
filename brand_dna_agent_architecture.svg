    <text x="380" y="425"
      text-anchor="middle"
      fill="#993C1D"
      font-size="12">
      sample · download · palette · LLM
    </text>
  </g>

  <line x1="380" y1="442" x2="380" y2="485"
    stroke="#73726C"
    stroke-width="1.6"
    marker-end="url(#arrow)"/>

