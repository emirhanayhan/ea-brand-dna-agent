    </text>

    <text x="220" y="531"
      text-anchor="middle"
      fill="#854F0B"
      font-size="12">
      20 images (default, configurable)
    </text>

    <!-- ASSIGNMENT -->
    <rect x="410" y="485" width="260" height="64" rx="10"
      fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>

    <text x="540" y="510"
      text-anchor="middle"
      fill="#633806"
      font-size="15"
      font-weight="600">
      Phase 2 — Assignment
    </text>

    <text x="540" y="531"
      text-anchor="middle"
      fill="#854F0B"
      font-size="12">
      12 per batch (default, configurable)
    </text>

  </g>

