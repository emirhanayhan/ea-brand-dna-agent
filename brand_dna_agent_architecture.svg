      --name · --url · --social_handle
    </text>
  </g>

  <!-- HEALTHCHECK -->
  <g font-family="Arial, sans-serif">
    <rect x="285" y="32" width="210" height="80" rx="10"
      fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>

    <text x="390" y="60"
      text-anchor="middle"
      fill="#085041"
