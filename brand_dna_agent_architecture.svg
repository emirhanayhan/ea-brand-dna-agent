  <path d="M380 485 C420 485, 460 485, 500 485"
    fill="none"
    stroke="#73726C"
    stroke-width="1.6"
    marker-end="url(#arrow)"/>

  <!-- TO SYNTHESIS -->
  <path d="M220 549 C220 590, 330 590, 380 620"
    fill="none"
    stroke="#73726C"
    stroke-width="1.6"
    marker-end="url(#arrow)"/>

  <path d="M540 549 C540 590, 430 590, 380 620"
    fill="none"
    stroke="#73726C"
    stroke-width="1.6"
    marker-end="url(#arrow)"/>

