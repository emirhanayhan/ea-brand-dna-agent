[pytest]
testpaths =
    tests/unit_tests
    tests/integration_tests
    tests/benchmarks
pythonpath = .
markers =
    integration: live network tests (metadata extraction, social verification, etc.)
    llm_integration: live LLM config inference tests (requires GEMINI_API_KEY)
    benchmark: Brand DNA PDF LLM model benchmarks (requires GEMINI_API_KEY, --run-benchmark)
